# Include inside the atlas.predhit.com HTTPS server only.
location = /simple-backup { return 308 /simple-backup/; }
location = /simple-backup/ {
    root /opt/simple-backup/public;
    try_files /index.html =404;
    default_type text/html;
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
}
location ^~ /simple-backup/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    client_max_body_size 9m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    access_log off;
    # Do not log holder-specific URLs/headers on upstream errors.
    error_log /dev/null crit;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
}
